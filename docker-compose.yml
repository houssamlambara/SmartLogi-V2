services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: smartlogi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    container_name: smartlogi-api
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartlogi_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: simple-secret-key
      JWT_EXPIRATION: 86400000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_LIQUIBASE_ENABLED: "true"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: smartlogi-jenkins
    user: root
    privileged: true
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    entrypoint: >
      sh -c "
      chown jenkins:jenkins /var/jenkins_home &&
      chmod 666 /var/run/docker.sock &&
      su jenkins -c '/usr/local/bin/jenkins.sh'
      "
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  jenkins_home:
    driver: local
