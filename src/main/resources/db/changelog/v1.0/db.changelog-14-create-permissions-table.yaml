databaseChangeLog:
  - changeSet:
      id: 14-create-permissions-table
      author: smartlogi
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: permissions
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

