databaseChangeLog:
  - changeSet:
      id: 1
      author: houssam
      changes:
        - createTable:
            tableName: client_expediteur
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: telephone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: adresse
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
  - changeSet:
      id: add-user-fk-to-client
      author: houssam
      changes:
        - addColumn:
            tableName: client_expediteur
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: client_expediteur
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_client_user
            onDelete: SET NULL
            onUpdate: CASCADE

