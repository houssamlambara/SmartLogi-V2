spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/smartlogi_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/v1.0/db.changelog-master.yaml
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:dummy@gmail.com}
    password: ${SMTP_PASSWORD:dummy-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.houssam.SmartLogi: INFO
    org.hibernate.SQL: ERROR

