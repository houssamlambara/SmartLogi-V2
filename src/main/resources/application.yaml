spring:
  application:
    name: SmartLogi

  datasource:
    url: jdbc:postgresql://localhost:5432/smartlogi_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/v1.0/db.changelog-master.yaml
    enabled: true

server:
  port: 8080

# Configuration Email SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: votre-email@gmail.com
    password: votre-mot-de-passe-app
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.smartlogi: DEBUG
    org.hibernate.SQL: DEBUG
